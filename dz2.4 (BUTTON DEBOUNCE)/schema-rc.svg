<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect width="560" height="360" fill="#ffffff"/>
  <g stroke="#222" stroke-width="2" fill="none" stroke-linecap="square">

    <!-- ========== ланка кнопки з RC-фільтром ========== -->
    <!-- шина 3.3 В -->
    <line x1="92" y1="40" x2="148" y2="40"/>
    <line x1="120" y1="40" x2="120" y2="62"/>

    <!-- R1 10k, підтяжка -->
    <rect x="106" y="62" width="28" height="56"/>
    <line x1="120" y1="118" x2="120" y2="150"/>

    <!-- вузол -> GPIO 16 -->
    <line x1="120" y1="150" x2="300" y2="150"/>
    <circle cx="120" cy="150" r="3.5" fill="#222"/>
    <line x1="120" y1="150" x2="120" y2="186"/>

    <!-- розгалуження на конденсатор і на кнопку -->
    <line x1="64" y1="186" x2="190" y2="186"/>
    <circle cx="120" cy="186" r="3.5" fill="#222"/>

    <!-- C1 100n -->
    <line x1="64" y1="186" x2="64" y2="206"/>
    <line x1="46" y1="206" x2="82" y2="206"/>
    <line x1="46" y1="216" x2="82" y2="216"/>
    <line x1="64" y1="216" x2="64" y2="286"/>

    <!-- R2 100 послідовно з кнопкою -->
    <line x1="190" y1="186" x2="190" y2="200"/>
    <rect x="176" y="200" width="28" height="56"/>
    <line x1="190" y1="256" x2="190" y2="276"/>

    <!-- SW1 -->
    <circle cx="190" cy="279" r="3"/>
    <line x1="193" y1="277" x2="216" y2="258"/>
    <circle cx="190" cy="303" r="3"/>
    <line x1="190" y1="306" x2="190" y2="316"/>

    <!-- спільна земля ланки -->
    <line x1="64" y1="286" x2="64" y2="316"/>
    <line x1="64" y1="316" x2="190" y2="316"/>
    <line x1="127" y1="316" x2="127" y2="326"/>
    <line x1="107" y1="326" x2="147" y2="326"/>
    <line x1="114" y1="332" x2="140" y2="332"/>
    <line x1="121" y1="338" x2="133" y2="338"/>

    <!-- ========== ланка світлодіода ========== -->
    <line x1="430" y1="88" x2="430" y2="112"/>
    <rect x="416" y="112" width="28" height="56"/>
    <line x1="430" y1="168" x2="430" y2="214"/>

    <!-- VD1 -->
    <line x1="410" y1="244" x2="450" y2="244"/>
    <line x1="410" y1="214" x2="450" y2="214"/>
    <line x1="410" y1="214" x2="430" y2="244"/>
    <line x1="450" y1="214" x2="430" y2="244"/>
    <line x1="430" y1="244" x2="430" y2="286"/>
    <line x1="452" y1="210" x2="466" y2="196"/>
    <line x1="462" y1="198" x2="466" y2="196"/>
    <line x1="464" y1="206" x2="466" y2="196"/>
    <line x1="458" y1="222" x2="472" y2="208"/>
    <line x1="468" y1="210" x2="472" y2="208"/>
    <line x1="470" y1="218" x2="472" y2="208"/>

    <!-- земля світлодіода -->
    <line x1="410" y1="286" x2="450" y2="286"/>
    <line x1="417" y1="292" x2="443" y2="292"/>
    <line x1="424" y1="298" x2="436" y2="298"/>

    <!-- точки підключення аналізатора -->
    <circle cx="255" cy="150" r="4" fill="#ffffff"/>
    <circle cx="190" cy="268" r="4" fill="#ffffff"/>
    <circle cx="430" cy="190" r="4" fill="#ffffff"/>
  </g>

  <g fill="#222" font-size="13">
    <text x="92" y="32">+3,3 В</text>
    <text x="142" y="96">R1</text>
    <text x="142" y="112">10 к</text>
    <text x="306" y="146">GPIO 16</text>
    <text x="306" y="162">ESP32-S3</text>
    <text x="8" y="204">C1</text>
    <text x="8" y="220">100 н</text>
    <text x="212" y="226">R2</text>
    <text x="212" y="242">100</text>
    <text x="224" y="292">SW1</text>
    <text x="396" y="82">GPIO 4</text>
    <text x="452" y="146">R3</text>
    <text x="452" y="162">220</text>
    <text x="368" y="266">VD1</text>
  </g>

  <g fill="#8a1f1f" font-size="12" font-weight="bold">
    <text x="240" y="138">D1</text>
    <text x="152" y="272">D0</text>
    <text x="440" y="186">D2</text>
  </g>

  <g fill="#666" font-size="11">
    <text x="240" y="330">D0 — до фільтра · D1 — після фільтра · D2 — реакція</text>
  </g>
</svg>
