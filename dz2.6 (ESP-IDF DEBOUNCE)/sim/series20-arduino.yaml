  # Окремо, 21-ша подія: подвійне натискання, де другий спад приходить через
  # 35 мс після першого — коротше за вікно 50 мс у time_debounce. На платі
  # така пара трапилась один раз випадково, тут вона задана свідомо.
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 20ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 15ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 100ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 600ms
