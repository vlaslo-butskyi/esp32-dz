      part-id: btn1
      control: pressed
      value: 0
  - delay: 250ms

  # 5 × ледь-ледь: утримання 25 мс, пауза 200 мс
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 25ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 200ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 25ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 200ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 25ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 200ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 25ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 200ms
