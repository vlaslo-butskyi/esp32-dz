name: sensor_queue
version: 1
author: Vlaslo Butskyi
steps:
  - wait-serial: 'consumer on core 1'
  - delay: 3000ms
  - set-control: { part-id: pot1, control: position, value: 0.2 }
  - delay: 2000ms
  - set-control: { part-id: pot1, control: position, value: 0.9 }
  - delay: 2000ms
  - set-control: { part-id: boot, control: pressed, value: 1 }
  - delay: 300ms
  - set-control: { part-id: boot, control: pressed, value: 0 }
  - delay: 700ms
  - set-control: { part-id: boot, control: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: boot, control: pressed, value: 0 }
  - delay: 700ms
  - set-control: { part-id: boot, control: pressed, value: 1 }
  - delay: 80ms
  - set-control: { part-id: boot, control: pressed, value: 0 }
  - delay: 700ms
  - set-control: { part-id: boot, control: pressed, value: 1 }
  - delay: 600ms
  - set-control: { part-id: boot, control: pressed, value: 0 }
  - delay: 700ms
  - set-control: { part-id: boot, control: pressed, value: 1 }
  - delay: 50ms
  - set-control: { part-id: boot, control: pressed, value: 0 }
  - delay: 700ms
  - set-control: { part-id: boot, control: pressed, value: 1 }
  - delay: 1000ms
  - set-control: { part-id: boot, control: pressed, value: 0 }
  - delay: 700ms
  - delay: 9000ms
