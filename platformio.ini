; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Активне ДЗ вибирається рівно одним розкоментованим рядком build_src_filter.
; Решта лежать поруч закоментованими, щоб перемикатися одним рухом.
; Після кожного перемикання: ./tools/compiledb.sh — інакше IDE не бачить джерел.
;
; build_src_filter = +<../dz1.4 (LED + BUTTON)/toggle/main.cpp>
; build_src_filter = +<../dz1.4 (LED + BUTTON)/modes/main.cpp>

; build_src_filter = +<../dz1.5 (BUTTON BOUNCE)/counter/main.cpp>
; build_src_filter = +<../dz1.5 (BUTTON BOUNCE)/debounce/main.cpp>

; build_src_filter = +<../dz1.6 (LDR LIGHT)/light/main.cpp>

; build_src_filter = +<../dz1.7 (TWILIGHT SWITCH)/twilight/main.cpp>
; build_src_filter = +<../dz1.7 (TWILIGHT SWITCH)/twilight_with_modes/main.cpp>
; build_src_filter = +<../dz1.7 (TWILIGHT SWITCH)/twilight_with_modes_rgb/main.cpp>
;
; dz1.8 — єдине ДЗ з кількох файлів, йому потрібен ще й build_flags:
; build_src_filter = +<../dz1.8 (SMART ALARM)/alarm/src/*.cpp>
; build_flags = -I "dz1.8 (SMART ALARM)/alarm/include"
;
; build_src_filter = +<../dz2.1 (EMBEDDED C++)/blink/main.cpp>
; build_src_filter = +<../dz2.1 (EMBEDDED C++)/blink_modes/main.cpp>

; build_src_filter = +<../dz2.2 (POWER LOAD)/relay_timing/main.cpp>
; build_src_filter = +<../dz2.2 (POWER LOAD)/motor_pwm/main.cpp>
; build_src_filter = +<../dz2.2 (POWER LOAD)/uart_pwm/main.cpp>

; lib_deps = adafruit/Adafruit NeoPixel@^1.15.5
