; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Без -e збирається тільки Arduino-env: ДЗ 1.x-2.5 живуть у ньому, активну
; прошивку вибирає build_src_filter. ESP-IDF env (ДЗ 2.6, 2.7) запускаються явно:
;   pio run -e idf_raw_interrupt
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Активне ДЗ вибирається рівно одним розкоментованим рядком build_src_filter.
; Решта лежать поруч закоментованими, щоб перемикатися одним рухом.
; Після кожного перемикання: ./tools/compiledb.sh — інакше IDE не бачить джерел.
;
; build_src_filter = +<../dz1.4 (LED + BUTTON)/toggle/main.cpp>
; build_src_filter = +<../dz1.4 (LED + BUTTON)/modes/main.cpp>

; build_src_filter = +<../dz1.5 (BUTTON BOUNCE)/counter/main.cpp>
; build_src_filter = +<../dz1.5 (BUTTON BOUNCE)/debounce/main.cpp>

; build_src_filter = +<../dz1.6 (LDR LIGHT)/light/main.cpp>

; build_src_filter = +<../dz1.7 (TWILIGHT SWITCH)/twilight/main.cpp>
; build_src_filter = +<../dz1.7 (TWILIGHT SWITCH)/twilight_with_modes/main.cpp>
; build_src_filter = +<../dz1.7 (TWILIGHT SWITCH)/twilight_with_modes_rgb/main.cpp>
;
; dz1.8 — єдине ДЗ з кількох файлів, йому потрібен ще й build_flags:
; build_src_filter = +<../dz1.8 (SMART ALARM)/alarm/src/*.cpp>
; build_flags = -I "dz1.8 (SMART ALARM)/alarm/include"
;
; build_src_filter = +<../dz2.1 (EMBEDDED C++)/blink/main.cpp>
; build_src_filter = +<../dz2.1 (EMBEDDED C++)/blink_modes/main.cpp>
; build_src_filter = +<../dz2.1 (EMBEDDED C++)/blink_mmio/main.cpp>

; build_src_filter = +<../dz2.2 (POWER LOAD)/relay_timing/main.cpp>
; build_src_filter = +<../dz2.2 (POWER LOAD)/motor_pwm/main.cpp>
; build_src_filter = +<../dz2.2 (POWER LOAD)/uart_pwm/main.cpp>

; build_src_filter = +<../dz2.3 (SUPERLOOP)/three_leds/main.cpp>

; dz2.4 — вісім варіантів парами: ліві чотири на голих контактах,
; праві чотири — та сама прошивка на платі з RC-фільтром (завдання 5).
; Перед запуском RC-варіанта в Wokwi: make -C "dz2.4 (BUTTON DEBOUNCE)/chips"
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/raw_interrupt/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/time_debounce/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/state_debounce/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/polling_debounce/main.cpp>
;
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/raw_interrupt_rc/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/time_debounce_rc/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/state_debounce_rc/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/polling_debounce_rc/main.cpp>

; dz2.5 — п'ять прошивок того самого циклу витяжки, від найпростішої до повної.
; fan_full додатково вимагає кнопки на GPIO 16 і третього світлодіода на GPIO 6.
build_src_filter = +<../dz2.5 (TIMERS)/timer_tick/main.cpp>
; build_src_filter = +<../dz2.5 (TIMERS)/timer_phase/main.cpp>
; build_src_filter = +<../dz2.5 (TIMERS)/two_timers/main.cpp>
; build_src_filter = +<../dz2.5 (TIMERS)/millis_vs_timer/main.cpp>
; build_src_filter = +<../dz2.5 (TIMERS)/fan_full/main.cpp>

; ─────────────── ESP-IDF: ДЗ 2.6 (framework = espidf) ───────────────
; Канонічна збірка цих прошивок — нативний idf.py через обгортку:
;   ./tools/idf.sh "dz2.6 (ESP-IDF DEBOUNCE)/raw_interrupt" build
;   ./tools/idf.sh "dz2.6 (ESP-IDF DEBOUNCE)/raw_interrupt" flash monitor
; Там ESP-IDF v5.5.5 (поставлений через eim), build-каталог у ~/.cache.
;
; Env нижче — другий шлях до тих самих прошивок: той самий main/main.c і той
; самий sdkconfig.defaults, але ESP-IDF із пакета framework-espidf і звичні
; команди pio:
;   pio run -e idf_raw_interrupt -t upload
;   pio device monitor -e idf_raw_interrupt
;
; Варіант вибирає src/CMakeLists.txt за змінною DZ_VARIANT, яку виставляє
; tools/pio_idf_variant.py з custom_dz_variant. Додати ще один варіант — три
; рядки: extends, custom_dz_variant, sdkconfig_path.

[espidf]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
extra_scripts = pre:tools/pio_idf_variant.py

[env:idf_raw_interrupt]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/raw_interrupt
board_build.esp-idf.sdkconfig_path = .pio/build/idf_raw_interrupt/sdkconfig

[env:idf_polling_debounce]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/polling_debounce
board_build.esp-idf.sdkconfig_path = .pio/build/idf_polling_debounce/sdkconfig

[env:idf_time_debounce]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/time_debounce
board_build.esp-idf.sdkconfig_path = .pio/build/idf_time_debounce/sdkconfig

[env:idf_state_debounce]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/state_debounce
board_build.esp-idf.sdkconfig_path = .pio/build/idf_state_debounce/sdkconfig

[env:idf_timer_debounce]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/timer_debounce
board_build.esp-idf.sdkconfig_path = .pio/build/idf_timer_debounce/sdkconfig

[env:idf_glitch_filter]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/glitch_filter
board_build.esp-idf.sdkconfig_path = .pio/build/idf_glitch_filter/sdkconfig

; ─────────────── ESP-IDF: ДЗ 2.7 (framework = espidf) ───────────────
; Дві прошивки: автомат світлофора за ПДР і він же зі шлагбаумом на серво.
; Канонічна збірка та сама:
;   ./tools/idf.sh "dz2.7 (TRAFFIC LIGHT)/traffic_light" build
;   ./tools/idf.sh "dz2.7 (TRAFFIC LIGHT)/traffic_light" flash monitor

[env:idf_traffic_light]
extends = espidf
custom_dz_variant = dz2.7 (TRAFFIC LIGHT)/traffic_light
board_build.esp-idf.sdkconfig_path = .pio/build/idf_traffic_light/sdkconfig

[env:idf_traffic_barrier]
extends = espidf
custom_dz_variant = dz2.7 (TRAFFIC LIGHT)/traffic_barrier
board_build.esp-idf.sdkconfig_path = .pio/build/idf_traffic_barrier/sdkconfig

; ─────────────── STM32: ДЗ 2.8 (framework = stm32cube) ───────────────
; Інший мікроконтролер і інша платформа, тому окремий env, не розширення
; попередніх. Прошивка — WeAct Black Pill, прошивається через ST-LINK V2
; (готові бінарники PlatformIO, окремий openocd чи stlink ставити не треба):
;   pio run -e stm32_button_modes -t upload
;
; Чіп на платі — STM32F411CEU6 (прочитано з маркування), плата WeAct V3.1.
; Код не залежить від моделі: світлодіод PC13 і кнопка PA0 однакові в усіх
; Black Pill, і прошивка збирається також під blackpill_f401cc і
; blackpill_f401ce — перевірено.

[stm32]
platform = ststm32
board = blackpill_f411ce
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink

[env:stm32_button_modes]
extends = stm32
build_src_filter = +<../dz2.8 (STM32 BUTTON)/button_modes/main.cpp>

; Діагностичний варіант тієї самої прошивки: додає лог у USART1 (PA9, 115200
; 8N1). Послідовного порту в цій звʼязці немає — USB-C плати йде на піни USB
; мікроконтролера, а синій ST-LINK V2 не має VCP. Тому лог читається або
; USB-UART перехідником, або логічним аналізатором з декодером Async Serial:
;   pio run -e stm32_button_modes_uart -t upload
[env:stm32_button_modes_uart]
extends = stm32
monitor_speed = 115200
build_src_filter = +<../dz2.8 (STM32 BUTTON)/button_modes_uart/main.cpp>

; ─────────────── STM32: ДЗ 2.9 (setup/loop у окремих файлах) ───────────────
; Перша прошивка в репозиторії з кількох файлів на STM32: main.c тримає HAL і
; тактування, app.c — блимання. Тому у фільтрі не один файл, а glob по *.c;
; app.h знаходиться сам — лапкове включення шукає спершу в каталозі main.c.
[env:stm32_app_blink]
extends = stm32
build_src_filter = +<../dz2.9 (SETUP LOOP)/blink/*.c>

; ─────────────── ESP-IDF: ДЗ 6.1 (задачі FreeRTOS) ───────────────
; ДЗ 2.3 (три світлодіоди) на xTaskCreatePinnedToCore замість superloop.
;   ./tools/idf.sh "dz6.1 (RTOS TASKS)/three_tasks" flash monitor

[env:idf_three_tasks]
extends = espidf
custom_dz_variant = dz6.1 (RTOS TASKS)/three_tasks
board_build.esp-idf.sdkconfig_path = .pio/build/idf_three_tasks/sdkconfig

; Та сама домашка на STM32F411 (Black Pill): світлодіоди на PB12/PB13/PB14.
; FreeRTOS береться з framework-stm32cubef4, збирає його pre-скрипт.
;   pio run -e stm32_three_tasks -t upload
[env:stm32_three_tasks]
extends = stm32
build_src_filter = +<../dz6.1 (RTOS TASKS)/three_tasks_stm32/main.cpp>
extra_scripts = pre:tools/pio_stm32_freertos.py
custom_freertos_config = dz6.1 (RTOS TASKS)/three_tasks_stm32

; ─────────────── ESP-IDF: ДЗ 6.2 (планувальник FreeRTOS) ───────────────
; Чотири задачі з різними пріоритетами, vTaskDelayUntil, vTaskSuspend/Resume,
; динамічне створення й vTaskDelete. Тільки вивід у UART, схеми немає.
;   ./tools/idf.sh "dz6.2 (RTOS SCHEDULER)/four_tasks" flash monitor

[env:idf_four_tasks]
extends = espidf
custom_dz_variant = dz6.2 (RTOS SCHEDULER)/four_tasks
board_build.esp-idf.sdkconfig_path = .pio/build/idf_four_tasks/sdkconfig

; Та сама домашка на STM32F411 (Black Pill). Лог іде в USART1 на PA9:
; читайте його перехідником USB-UART (CH340), RX перехідника на PA9.
;   pio run -e stm32_four_tasks -t upload
[env:stm32_four_tasks]
extends = stm32
monitor_speed = 115200
build_src_filter = +<../dz6.2 (RTOS SCHEDULER)/four_tasks_stm32/main.cpp>
extra_scripts = pre:tools/pio_stm32_freertos.py
custom_freertos_config = dz6.2 (RTOS SCHEDULER)/four_tasks_stm32

; ─────────────── ESP-IDF: ДЗ 6.3 (черги FreeRTOS) ───────────────
; Два датчики й кнопка BOOT -> одна черга -> один consumer.
; Потенціометр на GPIO1, температура — вбудований датчик чипа.
;   ./tools/idf.sh "dz6.3 (RTOS QUEUES)/sensor_queue" flash monitor

[env:idf_sensor_queue]
extends = espidf
custom_dz_variant = dz6.3 (RTOS QUEUES)/sensor_queue
board_build.esp-idf.sdkconfig_path = .pio/build/idf_sensor_queue/sdkconfig

; Та сама домашка на STM32F411 (Black Pill): потенціометр на PA1, кнопка KEY
; на PA0, лог у USART1 на PA9 (RXD перехідника CH340).
;   pio run -e stm32_sensor_queue -t upload
[env:stm32_sensor_queue]
extends = stm32
monitor_speed = 115200
build_src_filter = +<../dz6.3 (RTOS QUEUES)/sensor_queue_stm32/main.cpp>
extra_scripts = pre:tools/pio_stm32_freertos.py
custom_freertos_config = dz6.3 (RTOS QUEUES)/sensor_queue_stm32

; ─────────────── ESP-IDF: ДЗ 6.4 (кінцевий автомат) ───────────────
; Електронний сейф: автомат кнопки (Producer) -> черга -> автомат сейфа (Consumer).
; Кнопка на GPIO 16, світлодіод на GPIO 4.
;   ./tools/idf.sh "dz6.4 (STATE MACHINE)/safe_fsm" flash monitor

[env:idf_safe_fsm]
extends = espidf
custom_dz_variant = dz6.4 (STATE MACHINE)/safe_fsm
board_build.esp-idf.sdkconfig_path = .pio/build/idf_safe_fsm/sdkconfig

; Та сама домашка на STM32F411 (Black Pill): кнопка KEY на PA0 і світлодіод
; плати PC13, підключати нічого не треба. Лог у USART1 на PA9 (RXD CH340).
;   pio run -e stm32_safe_fsm -t upload
[env:stm32_safe_fsm]
extends = stm32
monitor_speed = 115200
build_src_filter = +<../dz6.4 (STATE MACHINE)/safe_fsm_stm32/main.cpp>
extra_scripts = pre:tools/pio_stm32_freertos.py
custom_freertos_config = dz6.4 (STATE MACHINE)/safe_fsm_stm32

; ─────────────── ESP-IDF: ДЗ 6.5 (mutex і семафори) ───────────────
; Конвеєр: датчик деталі (кнопка GPIO 16) в ISR, звіт з двох ядер у спільний
; буфер під mutex, аварійна зупинка BOOT -> задача з найвищим пріоритетом.
; Потенціометр на GPIO 1, світлодіод тривоги на GPIO 4.
;   ./tools/idf.sh "dz6.5 (MUTEX SEMAPHORE)/conveyor" flash monitor

[env:idf_conveyor]
extends = espidf
custom_dz_variant = dz6.5 (MUTEX SEMAPHORE)/conveyor
board_build.esp-idf.sdkconfig_path = .pio/build/idf_conveyor/sdkconfig

; Та сама домашка на STM32F411 (Black Pill): кнопка-датчик на PB12, аварійна
; зупинка KEY (PA0), потенціометр на PA1, світлодіод плати PC13.
; Лог у USART1 на PA9 (RXD перехідника CH340).
;   pio run -e stm32_conveyor -t upload
[env:stm32_conveyor]
extends = stm32
monitor_speed = 115200
build_src_filter = +<../dz6.5 (MUTEX SEMAPHORE)/conveyor_stm32/main.cpp>
extra_scripts = pre:tools/pio_stm32_freertos.py
custom_freertos_config = dz6.5 (MUTEX SEMAPHORE)/conveyor_stm32

; lib_deps = adafruit/Adafruit NeoPixel@^1.15.5
