; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Без -e збирається тільки Arduino-env: ДЗ 1.x-2.5 живуть у ньому, активну
; прошивку вибирає build_src_filter. ESP-IDF env (ДЗ 2.6, 2.7) запускаються явно:
;   pio run -e idf_raw_interrupt
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Активне ДЗ вибирається рівно одним розкоментованим рядком build_src_filter.
; Решта лежать поруч закоментованими, щоб перемикатися одним рухом.
; Після кожного перемикання: ./tools/compiledb.sh — інакше IDE не бачить джерел.
;
; build_src_filter = +<../dz1.4 (LED + BUTTON)/toggle/main.cpp>
; build_src_filter = +<../dz1.4 (LED + BUTTON)/modes/main.cpp>

; build_src_filter = +<../dz1.5 (BUTTON BOUNCE)/counter/main.cpp>
; build_src_filter = +<../dz1.5 (BUTTON BOUNCE)/debounce/main.cpp>

; build_src_filter = +<../dz1.6 (LDR LIGHT)/light/main.cpp>

; build_src_filter = +<../dz1.7 (TWILIGHT SWITCH)/twilight/main.cpp>
; build_src_filter = +<../dz1.7 (TWILIGHT SWITCH)/twilight_with_modes/main.cpp>
; build_src_filter = +<../dz1.7 (TWILIGHT SWITCH)/twilight_with_modes_rgb/main.cpp>
;
; dz1.8 — єдине ДЗ з кількох файлів, йому потрібен ще й build_flags:
; build_src_filter = +<../dz1.8 (SMART ALARM)/alarm/src/*.cpp>
; build_flags = -I "dz1.8 (SMART ALARM)/alarm/include"
;
; build_src_filter = +<../dz2.1 (EMBEDDED C++)/blink/main.cpp>
; build_src_filter = +<../dz2.1 (EMBEDDED C++)/blink_modes/main.cpp>
; build_src_filter = +<../dz2.1 (EMBEDDED C++)/blink_mmio/main.cpp>

; build_src_filter = +<../dz2.2 (POWER LOAD)/relay_timing/main.cpp>
; build_src_filter = +<../dz2.2 (POWER LOAD)/motor_pwm/main.cpp>
; build_src_filter = +<../dz2.2 (POWER LOAD)/uart_pwm/main.cpp>

; build_src_filter = +<../dz2.3 (SUPERLOOP)/three_leds/main.cpp>

; dz2.4 — вісім варіантів парами: ліві чотири на голих контактах,
; праві чотири — та сама прошивка на платі з RC-фільтром (завдання 5).
; Перед запуском RC-варіанта в Wokwi: make -C "dz2.4 (BUTTON DEBOUNCE)/chips"
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/raw_interrupt/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/time_debounce/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/state_debounce/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/polling_debounce/main.cpp>
;
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/raw_interrupt_rc/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/time_debounce_rc/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/state_debounce_rc/main.cpp>
; build_src_filter = +<../dz2.4 (BUTTON DEBOUNCE)/polling_debounce_rc/main.cpp>

; dz2.5 — п'ять прошивок того самого циклу витяжки, від найпростішої до повної.
; fan_full додатково вимагає кнопки на GPIO 16 і третього світлодіода на GPIO 6.
build_src_filter = +<../dz2.5 (TIMERS)/timer_tick/main.cpp>
; build_src_filter = +<../dz2.5 (TIMERS)/timer_phase/main.cpp>
; build_src_filter = +<../dz2.5 (TIMERS)/two_timers/main.cpp>
; build_src_filter = +<../dz2.5 (TIMERS)/millis_vs_timer/main.cpp>
; build_src_filter = +<../dz2.5 (TIMERS)/fan_full/main.cpp>

; ─────────────── ESP-IDF: ДЗ 2.6 (framework = espidf) ───────────────
; Канонічна збірка цих прошивок — нативний idf.py через обгортку:
;   ./tools/idf.sh "dz2.6 (ESP-IDF DEBOUNCE)/raw_interrupt" build
;   ./tools/idf.sh "dz2.6 (ESP-IDF DEBOUNCE)/raw_interrupt" flash monitor
; Там ESP-IDF v5.5.5 (поставлений через eim), build-каталог у ~/.cache.
;
; Env нижче — другий шлях до тих самих прошивок: той самий main/main.c і той
; самий sdkconfig.defaults, але ESP-IDF із пакета framework-espidf і звичні
; команди pio:
;   pio run -e idf_raw_interrupt -t upload
;   pio device monitor -e idf_raw_interrupt
;
; Варіант вибирає src/CMakeLists.txt за змінною DZ_VARIANT, яку виставляє
; tools/pio_idf_variant.py з custom_dz_variant. Додати ще один варіант — три
; рядки: extends, custom_dz_variant, sdkconfig_path.

[espidf]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
extra_scripts = pre:tools/pio_idf_variant.py

[env:idf_raw_interrupt]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/raw_interrupt
board_build.esp-idf.sdkconfig_path = .pio/build/idf_raw_interrupt/sdkconfig

[env:idf_polling_debounce]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/polling_debounce
board_build.esp-idf.sdkconfig_path = .pio/build/idf_polling_debounce/sdkconfig

[env:idf_time_debounce]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/time_debounce
board_build.esp-idf.sdkconfig_path = .pio/build/idf_time_debounce/sdkconfig

[env:idf_state_debounce]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/state_debounce
board_build.esp-idf.sdkconfig_path = .pio/build/idf_state_debounce/sdkconfig

[env:idf_timer_debounce]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/timer_debounce
board_build.esp-idf.sdkconfig_path = .pio/build/idf_timer_debounce/sdkconfig

[env:idf_glitch_filter]
extends = espidf
custom_dz_variant = dz2.6 (ESP-IDF DEBOUNCE)/glitch_filter
board_build.esp-idf.sdkconfig_path = .pio/build/idf_glitch_filter/sdkconfig

; ─────────────── ESP-IDF: ДЗ 2.7 (framework = espidf) ───────────────
; Одна прошивка — автомат світлофора за ПДР. Канонічна збірка та сама:
;   ./tools/idf.sh "dz2.7 (TRAFFIC LIGHT)/traffic_light" build
;   ./tools/idf.sh "dz2.7 (TRAFFIC LIGHT)/traffic_light" flash monitor

[env:idf_traffic_light]
extends = espidf
custom_dz_variant = dz2.7 (TRAFFIC LIGHT)/traffic_light
board_build.esp-idf.sdkconfig_path = .pio/build/idf_traffic_light/sdkconfig

; lib_deps = adafruit/Adafruit NeoPixel@^1.15.5
